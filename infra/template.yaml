# GENERATED by scripts/gen-template.mjs from packages/core/src/api/app.js — do not edit by hand.
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: SoftHub — serverless software marketplace (HTTP API, Lambda, DynamoDB, Cognito, Stripe, SES, S3)

Parameters:
  Stage:
    Type: String
    Default: prod
  AppUrl:
    Type: String
    Description: Public URL of the web app (CORS origin, links in e-mails)
  MailFrom:
    Type: String
    Description: Verified SES sender, e.g. orders@softhub.example

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures: [arm64]
    Timeout: 10
    Tracing: Active
    LoggingConfig:
      LogFormat: JSON
    Environment:
      Variables:
        TABLE_NAME: !Ref Table
        BUCKET_NAME: !Ref Bucket
        SECRET_ID: !Ref Secrets
        USER_POOL_ID: !Ref UserPool
        MAIL_FROM: !Ref MailFrom
        APP_URL: !Ref AppUrl
        ALLOWED_ORIGINS: !Ref AppUrl
        NODE_OPTIONS: --enable-source-maps

Resources:
  # ---------------------------------------------------------------- data
  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
        - { AttributeName: GSI2PK, AttributeType: S }
        - { AttributeName: GSI2SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: GSI2
          KeySchema:
            - { AttributeName: GSI2PK, KeyType: HASH }
            - { AttributeName: GSI2SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      StreamSpecification: { StreamViewType: NEW_AND_OLD_IMAGES }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      SSESpecification: { SSEEnabled: true }

  Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      VersioningConfiguration: { Status: Enabled }
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT]
            AllowedOrigins: [!Ref AppUrl]
            AllowedHeaders: [content-type]
            MaxAge: 600

  Secrets:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: 'SoftHub secrets: {"stripeSecretKey","stripeWebhookSecret","licenseSecret"} — set after first deploy'
      GenerateSecretString:
        SecretStringTemplate: '{"stripeSecretKey":"sk_test_replace","stripeWebhookSecret":"whsec_replace"}'
        GenerateStringKey: licenseSecret
        PasswordLength: 48
        ExcludePunctuation: true

  # ---------------------------------------------------------------- identity
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      UsernameConfiguration: { CaseSensitive: false }
      Policies:
        PasswordPolicy: { MinimumLength: 8, RequireLowercase: true, RequireUppercase: true, RequireNumbers: true, RequireSymbols: false }
      AccountRecoverySetting:
        RecoveryMechanisms: [{ Name: verified_email, Priority: 1 }]
      LambdaConfig:
        PostConfirmation: !GetAtt PostConfirmationFunction.Arn

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits: { AccessToken: minutes, IdToken: minutes, RefreshToken: days }
      EnableTokenRevocation: true

  ConsumerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: { GroupName: Consumer, UserPoolId: !Ref UserPool }
  ProviderGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: { GroupName: Provider, UserPoolId: !Ref UserPool }
  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: { GroupName: Admin, UserPoolId: !Ref UserPool, Description: Granted manually only }

  PostConfirmationFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties: { EntryPoints: [src/handler.js], Format: esm, OutExtension: [.js=.mjs], Target: node22, Minify: true, External: ['@aws-sdk/*'] }
    Properties:
      CodeUri: ../services/aws
      Handler: handler.postConfirmation
      MemorySize: 256
      Environment:
        Variables: { USER_POOL_ID: '' }
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - AWSSecretsManagerGetSecretValuePolicy: { SecretArn: !Ref Secrets }
        - Statement:
            - Effect: Allow
              Action: [cognito-idp:AdminAddUserToGroup]
              Resource: '*'

  PostConfirmationPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PostConfirmationFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  # ---------------------------------------------------------------- API
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      CorsConfiguration:
        AllowOrigins: [!Ref AppUrl]
        AllowHeaders: [authorization, content-type, idempotency-key]
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingBurstLimit: 200
        ThrottlingRateLimit: 100
      Auth:
        DefaultAuthorizer: Cognito
        Authorizers:
          Cognito:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience: [!Ref UserPoolClient]

  CatalogFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [src/handler.js]
        Format: esm
        OutExtension: [.js=.mjs]
        Target: node22
        Minify: true
        Sourcemap: true
        External: ['@aws-sdk/*']
    Properties:
      Description: Public catalogue reads
      CodeUri: ../services/aws
      Handler: handler.http
      MemorySize: 512
      Environment:
        Variables:
          FUNCTION_GROUP: catalog
      Policies:
      - DynamoDBReadPolicy:
          TableName: !Ref Table
      - AWSSecretsManagerGetSecretValuePolicy:
          SecretArn: !Ref Secrets
      Events:
        GetCategories:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /categories
            Auth:
              Authorizer: NONE
        GetProducts:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /products
            Auth:
              Authorizer: NONE
        GetProductsProductId:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /products/{productId}
            Auth:
              Authorizer: NONE
        GetProductsProductIdReviews:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /products/{productId}/reviews
            Auth:
              Authorizer: NONE
        GetProductsProductIdInsights:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /products/{productId}/insights
            Auth:
              Authorizer: NONE
        GetProductsProductIdRelated:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /products/{productId}/related
            Auth:
              Authorizer: NONE

  ShopFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [src/handler.js]
        Format: esm
        OutExtension: [.js=.mjs]
        Target: node22
        Minify: true
        Sourcemap: true
        External: ['@aws-sdk/*']
    Properties:
      Description: Cart, checkout, orders, reviews
      CodeUri: ../services/aws
      Handler: handler.http
      MemorySize: 512
      Environment:
        Variables:
          FUNCTION_GROUP: shop
      Policies:
      - DynamoDBCrudPolicy:
          TableName: !Ref Table
      - S3ReadPolicy:
          BucketName: !Ref Bucket
      - AWSSecretsManagerGetSecretValuePolicy:
          SecretArn: !Ref Secrets
      Events:
        GetMe:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /me
        GetMeRecommendations:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /me/recommendations
        GetCart:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /cart
        DeleteCart:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: DELETE
            Path: /cart
        PutCartProductId:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: PUT
            Path: /cart/{productId}
        DeleteCartProductId:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: DELETE
            Path: /cart/{productId}
        PostCheckout:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: POST
            Path: /checkout
        GetOrders:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /orders
        GetOrdersOrderId:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /orders/{orderId}
        GetOrdersOrderIdDownloadsProductId:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /orders/{orderId}/downloads/{productId}
        GetLibrary:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /library
        PostProductsProductIdReviews:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: POST
            Path: /products/{productId}/reviews

  ProviderFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [src/handler.js]
        Format: esm
        OutExtension: [.js=.mjs]
        Target: node22
        Minify: true
        Sourcemap: true
        External: ['@aws-sdk/*']
    Properties:
      Description: Listings and dashboards
      CodeUri: ../services/aws
      Handler: handler.http
      MemorySize: 512
      Environment:
        Variables:
          FUNCTION_GROUP: provider
      Policies:
      - DynamoDBCrudPolicy:
          TableName: !Ref Table
      - S3WritePolicy:
          BucketName: !Ref Bucket
      - AWSSecretsManagerGetSecretValuePolicy:
          SecretArn: !Ref Secrets
      Events:
        GetProviderProducts:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /provider/products
        PostProviderProducts:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: POST
            Path: /provider/products
        PutProviderProductsProductId:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: PUT
            Path: /provider/products/{productId}
        DeleteProviderProductsProductId:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: DELETE
            Path: /provider/products/{productId}
        PostProviderProductsProductIdUploads:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: POST
            Path: /provider/products/{productId}/uploads
        GetProviderDashboard:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /provider/dashboard

  AdminFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [src/handler.js]
        Format: esm
        OutExtension: [.js=.mjs]
        Target: node22
        Minify: true
        Sourcemap: true
        External: ['@aws-sdk/*']
    Properties:
      Description: Admin tools
      CodeUri: ../services/aws
      Handler: handler.http
      MemorySize: 256
      Environment:
        Variables:
          FUNCTION_GROUP: admin
      Policies:
      - DynamoDBCrudPolicy:
          TableName: !Ref Table
      - Statement:
          - Effect: Allow
            Action: [cognito-idp:AdminDisableUser, cognito-idp:AdminEnableUser, cognito-idp:AdminUserGlobalSignOut]
            Resource: !GetAtt UserPool.Arn
      - AWSSecretsManagerGetSecretValuePolicy:
          SecretArn: !Ref Secrets
      Events:
        GetAdminUsers:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /admin/users
        PutAdminUsersSubStatus:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: PUT
            Path: /admin/users/{sub}/status
        GetAdminMetrics:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /admin/metrics

  WebhookFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [src/handler.js]
        Format: esm
        OutExtension: [.js=.mjs]
        Target: node22
        Minify: true
        Sourcemap: true
        External: ['@aws-sdk/*']
    Properties:
      Description: Stripe webhook → fulfilment
      CodeUri: ../services/aws
      Handler: handler.http
      MemorySize: 512
      Environment:
        Variables:
          FUNCTION_GROUP: webhook
      Policies:
      - DynamoDBCrudPolicy:
          TableName: !Ref Table
      - AWSSecretsManagerGetSecretValuePolicy:
          SecretArn: !Ref Secrets
      Events:
        PostWebhooksStripe:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: POST
            Path: /webhooks/stripe
            Auth:
              Authorizer: NONE

  # ---------------------------------------------------------------- e-mail
  MailerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties: { EntryPoints: [src/handler.js], Format: esm, OutExtension: [.js=.mjs], Target: node22, Minify: true, External: ['@aws-sdk/*'] }
    Properties:
      Description: Stream → SES receipts
      CodeUri: ../services/aws
      Handler: handler.stream
      MemorySize: 256
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - AWSSecretsManagerGetSecretValuePolicy: { SecretArn: !Ref Secrets }
        - Statement:
            - Effect: Allow
              Action: [ses:SendEmail]
              Resource: '*'
      Events:
        Outbox:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt Table.StreamArn
            StartingPosition: LATEST
            BatchSize: 10
            MaximumRetryAttempts: 5
            BisectBatchOnFunctionError: true
            FunctionResponseTypes: [ReportBatchItemFailures]
            DestinationConfig:
              OnFailure: { Destination: !GetAtt MailerDeadLetters.Arn }
            FilterCriteria:
              Filters:
                - Pattern: '{"eventName":["INSERT"],"dynamodb":{"Keys":{"PK":{"S":[{"prefix":"OUTBOX#"}]}}}}'

  MailerDeadLetters:
    Type: AWS::SQS::Queue
    Properties: { MessageRetentionPeriod: 1209600, SqsManagedSseEnabled: true }

  # ---------------------------------------------------------------- alarms
  WebhookErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Stripe webhook failing — paid orders are not being fulfilled
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref WebhookFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  MailerDeadLettersAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Receipt e-mails could not be sent
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{ Name: QueueName, Value: !GetAtt MailerDeadLetters.QueueName }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  ApiUrl:
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
  StripeWebhookUrl:
    Description: Register this endpoint in the Stripe dashboard (payment_intent.*, charge.refunded)
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/webhooks/stripe
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  TableName:
    Value: !Ref Table
  SecretArn:
    Value: !Ref Secrets
